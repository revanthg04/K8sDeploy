version: '3.8'

services:
  mysql:
    image: mysql:latest
    container_name: mysql-container
    environment:
      - MYSQL_ROOT_PASSWORD=my-secret-pw
      - MYSQL_DATABASE=user
    ports:
      - "3307:3306"

  flask:
    build: .
    image: my-flask-image
    container_name: my-flask-app
    ports:
      - "5000:5000"
    depends_on:
      - mysql

